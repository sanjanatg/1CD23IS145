<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login – FW Module Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
  /* ── Login page specific ── */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    z-index: 2;
  }
  .login-card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1.5px solid rgba(255,255,255,0.13);
    border-radius: 20px;
    padding: 48px 44px 42px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo .org-badge {
    display: inline-block;
    margin-bottom: 10px;
  }
  .login-logo h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--text);
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .login-logo p {
    font-size: 0.82rem;
    color: var(--muted);
    margin: 0;
  }
  .login-divider {
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(14,127,168,0.4), transparent);
    margin: 20px 0 28px;
  }
  .login-field {
    margin-bottom: 18px;
  }
  .login-field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .login-field-wrap {
    position: relative;
  }
  .login-field input {
    width: 100%;
    padding: 11px 44px 11px 14px;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(22, 21, 21, 0.76);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.93rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    box-sizing: border-box;
  }
  .login-field input:focus {
    border-color: var(--accent);
    background: rgba(14, 127, 168, 0.205);
  }
  .login-field input::placeholder { color: rgba(3, 3, 3, 0.74); }
  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    padding: 2px;
    transition: color 0.15s;
  }
  .toggle-pw:hover { color: var(--accent); }
  .login-error {
    display: none;
    background: rgba(220,53,69,0.13);
    border: 1px solid rgba(220,53,69,0.35);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.82rem;
    color: #f87171;
    margin-bottom: 16px;
    text-align: center;
  }
  .login-error.show { display: block; }
  .login-attempts {
    font-size: 0.75rem;
    color: #f87171;
    text-align: center;
    margin-bottom: 12px;
    display: none;
  }
  .login-attempts.show { display: block; }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.18s, transform 0.15s, box-shadow 0.15s;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-login:hover:not(:disabled) {
    background: #0b6a91;
    transform: translateY(-1px);
    box-shadow: 0 4px 18px rgba(14,127,168,0.35);
  }
  .btn-login:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .login-lock-msg {
    display: none;
    text-align: center;
    font-size: 0.82rem;
    color: #f87171;
    margin-top: 14px;
  }
  .login-lock-msg.show { display: block; }
  .login-footer {
    text-align: center;
    margin-top: 22px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .login-card { padding: 32px 22px 28px; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="org-badge">TATA Advanced Systems</div>
      <h2>FW Module Tracker</h2>
      <p></p>
    </div>
    <div class="login-divider"></div>

    <div class="login-error" id="loginError">Incorrect username or password. Please try again.</div>
    <div class="login-attempts" id="loginAttempts"></div>

    <div class="login-field">
      <label for="loginUser">Username</label>
      <div class="login-field-wrap">
        <input type="text" id="loginUser" placeholder="Enter your username" autocomplete="username" onkeydown="onLoginKey(event)"/>
      </div>
    </div>

    <div class="login-field">
      <label for="loginPass">Password</label>
      <div class="login-field-wrap">
        <input type="password" id="loginPass" placeholder="Enter your password" autocomplete="current-password" onkeydown="onLoginKey(event)"/>
        <button class="toggle-pw" type="button" onclick="togglePassword()" title="Show/hide password" id="togglePwBtn">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sign In
    </button>

    <div class="login-lock-msg" id="lockMsg"></div>

    <div class="login-footer">Secure access · TATA Advanced Systems</div>
  </div>
</div>

<script>
  // ── Credentials (hashed via SHA-256 at runtime) ──
  // Default: username = admin | password = TASL@2026
  // To change: update the sha256('TASL@2026') call inside doLogin() below
  const CREDENTIALS = [
    { userHash: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918', passHash: '3a5f6b2c1e4d7f8a9b0c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3' }
    // userHash = SHA256('admin'), passHash = SHA256('TASL@2026')
  ];

  // Pre-computed hashes for default credentials
  const USER_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918'; // admin
  const PASS_HASH = 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3'; // TASL@2026 — will be computed live

  const MAX_ATTEMPTS = 5;
  const LOCK_MINUTES = 2;
  const SESSION_KEY = 'tw_auth_session';
  const LOCK_KEY = 'tw_auth_lock';

  // Check if already logged in
  (function() {
    const sess = sessionStorage.getItem(SESSION_KEY);
    if (sess === 'authenticated') {
      window.location.href = 'summary.html';
    }
  })();

  // Check lockout
  function getLock() {
    try { return JSON.parse(localStorage.getItem(LOCK_KEY) || 'null'); } catch { return null; }
  }
  function setLock(data) { localStorage.setItem(LOCK_KEY, JSON.stringify(data)); }

  function checkLocked() {
    const lock = getLock();
    if (!lock) return false;
    const now = Date.now();
    if (lock.lockedUntil && now < lock.lockedUntil) {
      const remaining = Math.ceil((lock.lockedUntil - now) / 60000);
      showLockMsg('Account locked. Try again in ' + remaining + ' minute(s).');
      document.getElementById('loginBtn').disabled = true;
      return true;
    }
    if (lock.lockedUntil && now >= lock.lockedUntil) {
      localStorage.removeItem(LOCK_KEY);
    }
    return false;
  }

  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function doLogin() {
    if (checkLocked()) return;

    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;

    if (!user || !pass) {
      showError('Please enter both username and password.');
      return;
    }

    const uHash = await sha256(user);
    const pHash = await sha256(pass);

    // Valid credentials check
    const valid = (
      uHash === '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918' &&
      pHash === await sha256('TASL@2026')
    );

    if (valid) {
      sessionStorage.setItem(SESSION_KEY, 'authenticated');
      localStorage.removeItem(LOCK_KEY);
      window.location.href = 'summary.html';
    } else {
      const lock = getLock() || { attempts: 0 };
      lock.attempts = (lock.attempts || 0) + 1;
      const remaining = MAX_ATTEMPTS - lock.attempts;

      if (lock.attempts >= MAX_ATTEMPTS) {
        lock.lockedUntil = Date.now() + LOCK_MINUTES * 60 * 1000;
        setLock(lock);
        showError('Too many failed attempts.');
        showLockMsg('Account locked for ' + LOCK_MINUTES + ' minutes.');
        document.getElementById('loginBtn').disabled = true;
      } else {
        setLock(lock);
        showError('Incorrect username or password.');
        showAttempts(remaining + ' attempt' + (remaining === 1 ? '' : 's') + ' remaining before lockout.');
      }
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
    }
  }

  function showError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
  }
  function showAttempts(msg) {
    const el = document.getElementById('loginAttempts');
    el.textContent = msg;
    el.classList.add('show');
  }
  function showLockMsg(msg) {
    const el = document.getElementById('lockMsg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function togglePassword() {
    const inp = document.getElementById('loginPass');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
    }
  }

  function onLoginKey(e) {
    if (e.key === 'Enter') doLogin();
    // Clear error on typing
    document.getElementById('loginError').classList.remove('show');
  }

  // On load — check lockout state
  checkLocked();
</script>
</body>
</html>
